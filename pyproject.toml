[project]
name = "study-hub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.18",
    "certifi==2026.10.23",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.9",
]

[tool.vercel.scripts]
build = 'if [ "$VERCEL_ENV" = "production" ]; then python manage.py migrate --noinput; fi'
